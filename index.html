<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>What are you going to do? · 나의 계획 말하기</title>
  <link rel="stylesheet" href="https://hangeul.pstatic.net/hangeul_static/css/nanum-square-round.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div class="floaty floaty1">🍁</div>
    <div class="floaty floaty2">🍂</div>
    <div class="leaves" aria-hidden="true">
      <span>🍁</span><span>🍂</span><span>🍁</span><span>🍂</span><span>🍁</span><span>🍂</span>
    </div>
    <h1>🗓️ What are you going to do?</h1>
    <p class="subtitle">6학년 9단원 · 나의 계획 묻고 말하기 · <b>I'm going to ___.</b></p>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="basic">🎨 <span class="tab-long">활동 카드 (초급)</span><span class="tab-short">초급 카드</span></button>
    <button class="tab-btn" data-tab="mid">🎨 <span class="tab-long">활동 카드 (중급)</span><span class="tab-short">중급 카드</span></button>
    <button class="tab-btn" data-tab="practice">🎤 연습하기<span id="plan-count" class="tab-count">0/5</span></button>
  </nav>

  <div class="toolbar">
    <button id="photo-toggle" class="btn small ghost">📷 실제 사진 켜짐</button>
    <label class="speed-control">말하기 속도
      <input id="rate" type="range" min="0.6" max="1.1" step="0.05" value="0.85" />
    </label>
    <span id="voice-status" class="voice-status"></span>
  </div>

  <main>
    <!-- ===== 🎨 활동 카드 (초급) : I'm going to fly a kite. ===== -->
    <section id="tab-basic" class="tab-panel active">
      <div id="board-basic"></div>
    </section>

    <!-- ===== 🎨 활동 카드 (중급) : I'm going to fly a kite on the hill. ===== -->
    <section id="tab-mid" class="tab-panel">
      <div id="board-mid"></div>
    </section>

    <!-- ===== 🎤 연습하기 : 나의 계획표 ===== -->
    <section id="tab-practice" class="tab-panel">
      <div class="section-block">
        <h2>📝 나의 계획표 <span class="count">My Plans</span></h2>
        <p class="hint"><b>🎨 활동 카드</b>에서 고른 대답이 질문 순서대로 정리돼요. 🔊를 눌러 듣고 따라 말해 봐요. 빈 칸은 활동 카드에서 질문을 고르고 카드를 선택해 채우고, ✕ 를 누르면 뺄 수 있어요.</p>
        <div class="plan-name">
          <label>✏️ 내 이름 <input id="my-name" type="text" maxlength="20" placeholder="이름을 써요" /></label>
          <div class="plan-name-btns">
            <button id="plan-listen-all" class="btn small" disabled>🔊 전체 듣기</button>
            <button id="print-plan" class="btn small primary">🖨️ 인쇄하기</button>
          </div>
        </div>
        <div id="plan-summary" class="plan-board"></div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>

  <footer class="app-footer">
    <span class="voice-status">6학년 영어 9단원 · What are you going to do? 🍁</span>
    <span class="voice-status">사진: Wikipedia · Wikimedia Commons (인터넷 연결 시 표시)</span>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
